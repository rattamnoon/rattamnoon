name: Profile Cards

on:
  schedule:
    - cron: "0 1 * * *"
  push:
    branches: [master]
    paths:
      - ".github/workflows/profile-cards.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&theme=github_dark&title_color=3fb950&icon_color=3fb950&ring_color=3fb950
          path: profile/stats.svg
          token: ${{ secrets.GH_TOKEN }}

      - uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&hide_border=true&background=0d1117&ring=3fb950&fire=3fb950&currStreakLabel=3fb950&currStreakNum=e6edf3&sideNums=e6edf3&sideLabels=8b949e&dates=8b949e&stroke=30363d
          path: profile/streak.svg
          token: ${{ secrets.GH_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "update profile cards" || exit 0
          git push
